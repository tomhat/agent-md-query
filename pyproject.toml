[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-md-query"
version = "0.1.0"
description = "Query Markdown files by YAML Front Matter"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6",
]

[project.scripts]
agent-md-query = "agent_md_query.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
